# DCS API credential for this workload cluster.
#
# Do NOT apply this file.
# Do NOT copy an old-environment Secret (endpoint, site, authUser, authKey).
# Create the Secret on Global Master 01 with kubectl create secret generic.
# kubectl apply on a Secret writes last-applied-configuration and can leak authKey.
#
# [Global Master 01]
#
# kubectl -n cpaas-system create secret generic dcs-workloadcluster-dcs-secret \
#   --from-literal=authUser='<dcs-auth-user>' \
#   --from-literal=authKey='<dcs-auth-key>' \
#   --from-literal=endpoint='<dcs-endpoint>' \
#   --from-literal=site='<dcs-site-id>' \
#   --from-literal=userType='interconnect'
#
# This environment (still do NOT apply this file; create with kubectl):
#   authUser: acpapi
#   endpoint: https://10.243.166.4:7443
#   site: 1C7F1082
#   authKey: never commit; write it only in /root/dcs-credential.env on Global Master 01
#
# endpoint default port is TCP 7443 (http:// or https://).
# userType is interconnect (default) or domain. Other values are rejected.
# Interconnect user: DCS administrator role; first-login password change must be No.
# Domain user: DCS must already enable domain auth; create this Secret from YAML
# only (the UI cannot set userType).
#
# After create, confirm keys exist without printing values:
#   kubectl -n cpaas-system get secret dcs-workloadcluster-dcs-secret \
#     -o jsonpath='{range $k,$v := .data}{$k}{"\n"}{end}'
# Required keys: authUser, authKey, endpoint, site.
# Optional key: userType.
#
# Later password rotation:
#   kubectl -n cpaas-system patch secret dcs-workloadcluster-dcs-secret \
#     --type merge \
#     -p '{"stringData":{"authKey":"<new-dcs-auth-key>"}}'
#
# This example is documentation only.
apiVersion: v1
kind: Secret
metadata:
  name: dcs-workloadcluster-dcs-secret
  namespace: cpaas-system
type: Opaque
stringData:
  authUser: "<dcs-auth-user>"
  authKey: "<dcs-auth-key>"
  endpoint: "<dcs-endpoint>"
  site: "<dcs-site-id>"
  userType: "interconnect"
