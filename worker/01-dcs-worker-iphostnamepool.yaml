# Worker DCSIpHostnamePool. Three entries for HA 3+3.
# Same field rules as the control-plane pool.
# This environment worker: 10.243.166.44-46/26, gw 10.243.166.1, dns 10.243.132.38.
# Do not reuse CP 10.243.166.41-43, VIP 10.243.166.13, or olvm-workloadcluster addresses.
# Other environments: three unused addresses; mask is prefix length only.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DCSIpHostnamePool
metadata:
  name: dcs-workloadcluster-worker-ippool
  namespace: cpaas-system
spec:
  pool:
    - ip: "10.243.166.44"
      mask: "26"
      gateway: "10.243.166.1"
      dns: "10.243.132.38"
      hostname: "dcs-workloadcluster-worker-1"
      machineName: "dcs-workloadcluster-worker-1"
      persistentDisk:
        - slot: 0
          quantityGB: 100
          datastoreClusterName: jkt01-POC-DEV-DCS-01
          path: /var/cpaas
          format: xfs
          mountOptions:
            - defaults
    - ip: "10.243.166.45"
      mask: "26"
      gateway: "10.243.166.1"
      dns: "10.243.132.38"
      hostname: "dcs-workloadcluster-worker-2"
      machineName: "dcs-workloadcluster-worker-2"
      persistentDisk:
        - slot: 0
          quantityGB: 100
          datastoreClusterName: jkt01-POC-DEV-DCS-01
          path: /var/cpaas
          format: xfs
          mountOptions:
            - defaults
    - ip: "10.243.166.46"
      mask: "26"
      gateway: "10.243.166.1"
      dns: "10.243.132.38"
      hostname: "dcs-workloadcluster-worker-3"
      machineName: "dcs-workloadcluster-worker-3"
      persistentDisk:
        - slot: 0
          quantityGB: 100
          datastoreClusterName: jkt01-POC-DEV-DCS-01
          path: /var/cpaas
          format: xfs
          mountOptions:
            - defaults
