# Control-plane DCSMachineTemplate.
# Official required disks for control plane:
#   systemVolume, /var/lib/kubelet 100G, /var/lib/containerd 100G, /var/lib/etcd 10G.
# quantity 0 on systemVolume means use the Alauda OS VM template disk size.
# Memory quantity is MB. CPU quantity is cores.
# This environment: template slem-alaudaos-vda, folder ACP_Cluster.
# This environment has no Datastore Cluster; disks use datastoreName.
# Compute cluster ManagementCluster is not a YAML field; VMs land via DCS placement.
# /var/cpaas is declared on the IP pool, not here.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DCSMachineTemplate
metadata:
  name: dcs-workloadcluster-cp-template
  namespace: cpaas-system
spec:
  template:
    spec:
      vmTemplateName: slem-alaudaos-vda
      location:
        type: folder
        name: ACP_Cluster
      vmConfig:
        dvSwitchName: ManagementDVS
        portGroupName: VLAN-329
        dcsMachineCpuSpec:
          quantity: 16
        dcsMachineMemorySpec:
          quantity: 32768
        dcsMachineDiskSpec:
          - quantity: 0
            datastoreName: jkt01-POC-DEV-DCS-01
            systemVolume: true
          - quantity: 100
            datastoreName: jkt01-POC-DEV-DCS-01
            path: /var/lib/kubelet
            format: xfs
          - quantity: 100
            datastoreName: jkt01-POC-DEV-DCS-01
            path: /var/lib/containerd
            format: xfs
          - quantity: 10
            datastoreName: jkt01-POC-DEV-DCS-01
            path: /var/lib/etcd
            format: xfs
      ipHostPoolRef:
        name: dcs-workloadcluster-cp-ippool
