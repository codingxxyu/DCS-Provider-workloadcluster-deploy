# DCSCluster for dcs-workloadcluster.
# ACP v4.3.2: controlPlaneLoadBalancer.type must be external.
# type: internal (Self-built VIP) requires DCS Provider v1.0.22+ AND ACP v4.4+.
# host and controlPlaneEndpoint.host must be the reserved Workload API VIP.
# This environment: 10.243.166.13. Do not reuse olvm-workloadcluster VIP 10.243.166.12.
# Other environments: another unused IPv4; both host fields must stay identical.
# This environment site ID: 1C7F1082 (portal Name is "site").
# This environment compute cluster is ManagementCluster, currently 1 host.
# Keep controlPlaneHA.enabled: false until there are enough hosts for 3 CP VMs.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DCSCluster
metadata:
  name: dcs-workloadcluster
  namespace: cpaas-system
spec:
  controlPlaneLoadBalancer:
    host: 10.243.166.13
    port: 6443
    type: external
  credentialSecretRef:
    name: dcs-workloadcluster-dcs-secret
  controlPlaneEndpoint:
    host: 10.243.166.13
    port: 6443
  controlPlaneHA:
    enabled: false
  networkType: kube-ovn
  site: "1C7F1082"
